wazuh_indexer:
  - path: /etc/wazuh-indexer/opensearch.yml
    replace:
      keys:
        - .["network.host"]
        - .["node.name"]
        - .["cluster.initial_cluster_manager_nodes"][0]
        - .["plugins.security.nodes_dn"][0]
      values:
        - \"127.0.0.1\"
        - \"__indexer_node_name__\" # Placeholder for indexer node name that will be replaced during configuration
        - \"__indexer_node_name__\"
        - \"CN=__indexer_node_name__,OU=Wazuh,O=Wazuh,L=California,C=US\"
wazuh_manager:
  - path: /var/wazuh-manager/etc/wazuh-manager.conf
    replace:
      keys:
        - .wazuh_config.indexer.hosts.host
        - .wazuh_config.indexer.ssl.certificate_authorities.ca
        - .wazuh_config.indexer.ssl.certificate
        - .wazuh_config.indexer.ssl.key
        # The packaged wazuh-manager.conf binds remoted's agent ports (1517 HTTPS, 1514 legacy) to
        # loopback; on a standalone VM the manager must listen on all interfaces or no external
        # agent can enroll/connect. The packaged global_prefix (/wazuh-manager/) is left as-is:
        # agent packages request under that same prefix by default, so the defaults already
        # match end to end.
        - .wazuh_config.remote.https.bind_addr
        - .wazuh_config.remote.legacy.local_ip
      values:
        - https://127.0.0.1:9200
        - /var/wazuh-manager/etc/certs/root-ca.pem
        - /var/wazuh-manager/etc/certs/indexer-connector.pem
        - /var/wazuh-manager/etc/certs/indexer-connector-key.pem
        - 0.0.0.0
        - 0.0.0.0
wazuh_agent:
  - path: /var/ossec/etc/ossec.conf
    replace:
      keys:
        # Where the agent connects once it is enrolled. It matches the --address the first-boot
        # token is minted for, so the endpoint the token names and the one ossec.conf names are the
        # same: 127.0.0.1, with the default port 1517 and the default /wazuh-manager/ prefix.
        #
        # No <ssl><certificate_authorities> is written on purpose. The enrollment-token bootstrap
        # installs the trust anchor itself at /var/ossec/etc/certs/root-ca.pem on the agent's first
        # start, and the agent then resolves verification_mode to `full` from the presence of that
        # file. Naming the path here instead would point the agent at a file that does not exist
        # yet: the agent validates the configured CA before the bootstrap runs, and fails closed on
        # a CA it cannot read.
        - .ossec_config[0].agent.manager.endpoint
      values:
        - 127.0.0.1
