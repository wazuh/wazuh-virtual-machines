wazuh_indexer:
  - path: /etc/wazuh-indexer/opensearch.yml 
    replace:
      keys:
        - .["network.host"]
        - .["node.name"]
        - .["cluster.initial_cluster_manager_nodes"][0]
        - .["plugins.security.nodes_dn"][0]
      values:
        - \"127.0.0.1\"
        - \"__indexer_node_name__\" # Placeholder for indexer node name that will be replaced during configuration
        - \"__indexer_node_name__\"
        - \"CN=__indexer_node_name__,OU=Wazuh,O=Wazuh,L=California,C=US\"
wazuh_manager:
  - path: /var/wazuh-manager/etc/wazuh-manager.conf
    replace:
      keys:
        - .wazuh_config.indexer.hosts.host
        - .wazuh_config.indexer.ssl.certificate_authorities.ca
        - .wazuh_config.indexer.ssl.certificate
        - .wazuh_config.indexer.ssl.key
        # The packaged wazuh-manager.conf is written for a manager behind a reverse proxy: remoted
        # binds its agent ports (1517 HTTPS, 1514 legacy) to loopback and serves its API under
        # /wazuh-manager/, while agents request it at the root path. On a standalone VM the manager
        # must listen on all interfaces with no path prefix or no external agent can enroll/connect.
        - .wazuh_config.remote.https.bind_addr
        - .wazuh_config.remote.https.global_prefix
        - .wazuh_config.remote.legacy.local_ip
      values:
        - https://127.0.0.1:9200
        - /var/wazuh-manager/etc/certs/root-ca.pem
        - /var/wazuh-manager/etc/certs/indexer-connector.pem
        - /var/wazuh-manager/etc/certs/indexer-connector-key.pem
        - 0.0.0.0
        - /
        - 0.0.0.0
wazuh_agent:
  - path: /var/ossec/etc/ossec.conf
    replace:
      keys:
        - .ossec_config[0].agent.manager.address
      values:
        - 127.0.0.1
