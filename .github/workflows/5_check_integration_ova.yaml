run-name: "Check Integration OVA - ${{ github.event_name == 'workflow_dispatch' && format('Manual - PR #{0}', inputs.pr_number) || format('#{0} {1}', github.event.pull_request.number, github.event.pull_request.title) }}"
name: (5.x) Check Integration - OVA Build & Test

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to test'
        required: true
        type: number
      pr_head_ref:
        description: 'PR branch name (optional, will be fetched if not provided)'
        required: false
        type: string
      pr_head_sha:
        description: 'PR commit SHA (optional, will be fetched if not provided)'
        required: false
        type: string
      wazuh_automation_reference:
        description: 'Wazuh Automation branch/tag to use'
        required: false
        type: string
        default: '5.0.0'
  pull_request:
    types: [labeled]

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write

jobs:
  get_pr_info:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       !github.event.pull_request.draft &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(fromJSON('["test/integration","test/ova"]'), github.event.label.name))
    runs-on: ubuntu-24.04
    outputs:
      pr_number: ${{ steps.pr_data.outputs.pr_number }}
      pr_head_ref: ${{ steps.pr_data.outputs.pr_head_ref }}
      pr_head_sha: ${{ steps.pr_data.outputs.pr_head_sha }}
      pr_head_sha_short: ${{ steps.pr_data.outputs.pr_head_sha_short }}
      wazuh_automation_reference: ${{ github.event_name == 'workflow_dispatch' && inputs.wazuh_automation_reference || 'main' }}
    steps:
      - name: Extract PR data
        id: pr_data
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_HEAD_REF: ${{ inputs.pr_head_ref }}
          INPUT_HEAD_SHA: ${{ inputs.pr_head_sha }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PR_NUMBER="$INPUT_PR_NUMBER"
            PR_HEAD_REF="$INPUT_HEAD_REF"
            PR_HEAD_SHA="$INPUT_HEAD_SHA"
            # Fetch PR data from API if not provided
            if [ -z "$PR_HEAD_REF" ] || [ -z "$PR_HEAD_SHA" ]; then
              PR_DATA=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")
              PR_HEAD_REF=$(echo "$PR_DATA" | jq -r '.head.ref')
              PR_HEAD_SHA=$(echo "$PR_DATA" | jq -r '.head.sha')
            fi
          else
            PR_NUMBER="$EVENT_PR_NUMBER"
            PR_HEAD_REF="$EVENT_HEAD_REF"
            PR_HEAD_SHA="$EVENT_HEAD_SHA"
          fi

          echo "pr_number=${PR_NUMBER}" >> $GITHUB_OUTPUT
          echo "pr_head_ref=${PR_HEAD_REF}" >> $GITHUB_OUTPUT
          echo "pr_head_sha=${PR_HEAD_SHA}" >> $GITHUB_OUTPUT
          echo "✅ PR: #${PR_NUMBER}"
          echo "✅ Branch: ${PR_HEAD_REF}"
          echo "✅ SHA: ${PR_HEAD_SHA}"

  build_ova:
    needs: get_pr_info
    uses: ./.github/workflows/5_OVA_builder.yaml
    with:
      id: "pr-check-${{ needs.get_pr_info.outputs.pr_number }}"
      wazuh_virtual_machines_reference: ${{ needs.get_pr_info.outputs.pr_head_ref }}
      wazuh_automation_reference: ${{ needs.get_pr_info.outputs.wazuh_automation_reference }}
      is_stage: false
      ova_revision: "PR-${{ needs.get_pr_info.outputs.pr_number }}"
      wazuh_package_type: dev
      commit_list: '["latest", "latest", "latest", "latest", "latest"]'
      destroy: true
      checksum: false
      is_pr_check: true
    secrets: inherit

  test_ova:
    needs: [get_pr_info, build_ova]
    uses: ./.github/workflows/5_test-vm.yaml
    with:
      WAZUH_VIRTUAL_MACHINES_REFERENCE: ${{ needs.get_pr_info.outputs.pr_head_ref }}
      WAZUH_AUTOMATION_REFERENCE: ${{ needs.get_pr_info.outputs.wazuh_automation_reference }}
      test_type: ova
      wazuh_package_type: dev
      commit_list: '["latest", "latest", "latest", "latest", "latest"]'
      TESTS: ALL
      log_level: INFO
      ova_revision: latest
    secrets: inherit
