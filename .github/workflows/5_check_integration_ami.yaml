run-name: "Check Integration AMI - ${{ github.event_name == 'workflow_dispatch' && format('Manual - PR #{0}', inputs.pr_number) || format('#{0} {1}', github.event.pull_request.number, github.event.pull_request.title) }}"
name: (5.x) Check Integration - AMI Build & Test

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to test'
        required: true
        type: number
      pr_head_ref:
        description: 'PR branch name (optional, will be fetched if not provided)'
        required: false
        type: string
      pr_head_sha:
        description: 'PR commit SHA (optional, will be fetched if not provided)'
        required: false
        type: string
      wazuh_automation_reference:
        description: 'Wazuh Automation branch/tag to use'
        required: false
        type: string
        default: '5.0.0'
  pull_request:
    types: [labeled]

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write

jobs:
  get_pr_info:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       !github.event.pull_request.draft &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(fromJSON('["test/integration","test/ami"]'), github.event.label.name))
    runs-on: ubuntu-24.04
    outputs:
      issue_url: ${{ steps.get_issue.outputs.issue_url }}
      pr_number: ${{ steps.pr_data.outputs.pr_number }}
      pr_head_ref: ${{ steps.pr_data.outputs.pr_head_ref }}
      pr_head_sha: ${{ steps.pr_data.outputs.pr_head_sha }}
      wazuh_automation_reference: ${{ github.event_name == 'workflow_dispatch' && inputs.wazuh_automation_reference || 'main' }}
    steps:
      - name: Extract PR data
        id: pr_data
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_HEAD_REF: ${{ inputs.pr_head_ref }}
          INPUT_HEAD_SHA: ${{ inputs.pr_head_sha }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PR_NUMBER="$INPUT_PR_NUMBER"
            PR_HEAD_REF="$INPUT_HEAD_REF"
            PR_HEAD_SHA="$INPUT_HEAD_SHA"
            # Fetch PR data from API if not provided
            if [ -z "$PR_HEAD_REF" ] || [ -z "$PR_HEAD_SHA" ]; then
              PR_DATA=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")
              PR_HEAD_REF=$(echo "$PR_DATA" | jq -r '.head.ref')
              PR_HEAD_SHA=$(echo "$PR_DATA" | jq -r '.head.sha')
            fi
          else
            PR_NUMBER="$EVENT_PR_NUMBER"
            PR_HEAD_REF="$EVENT_HEAD_REF"
            PR_HEAD_SHA="$EVENT_HEAD_SHA"
          fi

          echo "pr_number=${PR_NUMBER}" >> $GITHUB_OUTPUT
          echo "pr_head_ref=${PR_HEAD_REF}" >> $GITHUB_OUTPUT
          echo "pr_head_sha=${PR_HEAD_SHA}" >> $GITHUB_OUTPUT
          echo "✅ PR: #${PR_NUMBER}"
          echo "✅ Branch: ${PR_HEAD_REF}"
          echo "✅ SHA: ${PR_HEAD_SHA}"

      - name: Get linked issue from PR
        id: get_issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE_URL=$(gh api graphql -f query='
            query {
              repository(owner: "${{ github.repository_owner }}", name: "${{ github.event.repository.name }}") {
                pullRequest(number: ${{ steps.pr_data.outputs.pr_number }}) {
                  closingIssuesReferences(first: 1) {
                    nodes {
                      url
                    }
                  }
                }
              }
            }
          ' --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[0].url // empty' 2>/dev/null || true)

          if [ -n "$ISSUE_URL" ]; then
            echo "✅ Found linked issue: $ISSUE_URL"
          else
            echo "ℹ️  No linked issue found"
          fi
          echo "issue_url=${ISSUE_URL}" >> $GITHUB_OUTPUT

  build_ami:
    needs: get_pr_info
    uses: ./.github/workflows/5_AMI_builder.yaml
    with:
      id: "pr-check-${{ needs.get_pr_info.outputs.pr_number }}"
      wazuh_virtual_machines_reference: ${{ needs.get_pr_info.outputs.pr_head_ref }}
      wazuh_automation_reference: ${{ needs.get_pr_info.outputs.wazuh_automation_reference }}
      is_stage: true
      ami_revision: 'check-pr'
      wazuh_package_type: dev
      architecture: '["amd64", "arm64"]'
      commit_list: '["latest", "latest", "latest", "latest", "latest"]'
      customizer_debug: false
      destroy: true
      issue: ${{ needs.get_pr_info.outputs.issue_url }}
      is_pr_check: true
    secrets: inherit

  test_ami_amd64:
    needs: [get_pr_info, build_ami]
    if: |
      always() &&
      needs.build_ami.result == 'success' &&
      needs.build_ami.outputs.ami_id_amd64 != '' &&
      needs.build_ami.outputs.ami_id_amd64 != null
    uses: ./.github/workflows/5_test-vm.yaml
    with:
      WAZUH_VIRTUAL_MACHINES_REFERENCE: ${{ needs.get_pr_info.outputs.pr_head_ref }}
      WAZUH_AUTOMATION_REFERENCE: ${{ needs.get_pr_info.outputs.wazuh_automation_reference }}
      test_type: ami
      host: ${{ needs.build_ami.outputs.ami_id_amd64 }}
      instance_type: c5a.2xlarge
      TESTS: ALL
      log_level: INFO
    secrets: inherit

  test_ami_arm64:
    needs: [get_pr_info, build_ami]
    if: |
      always() &&
      needs.build_ami.result == 'success' &&
      needs.build_ami.outputs.ami_id_arm64 != '' &&
      needs.build_ami.outputs.ami_id_arm64 != null
    uses: ./.github/workflows/5_test-vm.yaml
    with:
      WAZUH_VIRTUAL_MACHINES_REFERENCE: ${{ needs.get_pr_info.outputs.pr_head_ref }}
      WAZUH_AUTOMATION_REFERENCE: ${{ needs.get_pr_info.outputs.wazuh_automation_reference }}
      test_type: ami
      host: ${{ needs.build_ami.outputs.ami_id_arm64 }}
      instance_type: c6g.2xlarge
      TESTS: ALL
      log_level: INFO
    secrets: inherit

  cleanup_amis:
    needs: [build_ami, test_ami_amd64, test_ami_arm64]
    if: always() && needs.build_ami.result != 'skipped'
    runs-on: ubuntu-24.04
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_OVA_ROLE }}
          aws-region: us-east-1

      - name: Deregister AMI amd64
        if: ${{ needs.build_ami.outputs.ami_id_amd64 != '' }}
        env:
          AMI_ID: ${{ needs.build_ami.outputs.ami_id_amd64 }}
        run: |
          if [[ ! "$AMI_ID" =~ ^ami-[0-9a-f]{17}$ ]]; then
            echo "Invalid AMI ID format: $AMI_ID"
            exit 1
          fi

          echo "Deregistering AMI: ${AMI_ID}"

          SNAPSHOTS=$(aws ec2 describe-images --image-ids "${AMI_ID}" --query 'Images[0].BlockDeviceMappings[*].Ebs.SnapshotId' --output text 2>/dev/null || true)

          aws ec2 deregister-image --image-id "${AMI_ID}" || echo "Failed to deregister AMI ${AMI_ID}"

          if [ -n "$SNAPSHOTS" ]; then
            for SNAPSHOT in $SNAPSHOTS; do
              echo "Deleting snapshot: ${SNAPSHOT}"
              aws ec2 delete-snapshot --snapshot-id "${SNAPSHOT}" || echo "Failed to delete snapshot ${SNAPSHOT}"
            done
          fi

      - name: Deregister AMI arm64
        if: ${{ needs.build_ami.outputs.ami_id_arm64 != '' }}
        env:
          AMI_ID: ${{ needs.build_ami.outputs.ami_id_arm64 }}
        run: |
          if [[ ! "$AMI_ID" =~ ^ami-[0-9a-f]{17}$ ]]; then
            echo "Invalid AMI ID format: $AMI_ID"
            exit 1
          fi

          echo "Deregistering AMI: ${AMI_ID}"

          SNAPSHOTS=$(aws ec2 describe-images --image-ids "${AMI_ID}" --query 'Images[0].BlockDeviceMappings[*].Ebs.SnapshotId' --output text 2>/dev/null || true)

          aws ec2 deregister-image --image-id "${AMI_ID}" || echo "Failed to deregister AMI ${AMI_ID}"

          if [ -n "$SNAPSHOTS" ]; then
            for SNAPSHOT in $SNAPSHOTS; do
              echo "Deleting snapshot: ${SNAPSHOT}"
              aws ec2 delete-snapshot --snapshot-id "${SNAPSHOT}" || echo "Failed to delete snapshot ${SNAPSHOT}"
            done
          fi
